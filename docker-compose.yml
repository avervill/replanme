services:
  postgres:
    image: postgres:16-alpine
    container_name: reschedai-postgres
    environment:
      POSTGRES_DB: reschedai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reschedai-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    container_name: reschedai-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reschedai
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WHISPER_MODEL: ${WHISPER_MODEL:-gpt-4o-mini-transcribe}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma-3-27b-it}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    container_name: reschedai-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  postgres-data:
