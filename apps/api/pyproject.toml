[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resched-me-api"
version = "0.1.0"
description = "FastAPI backend for the Resched.me planning platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.15.0",
  "asyncpg>=0.30.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "langchain-openai>=1.2.1",
  "langgraph>=1.2.0",
  "openai>=1.60.0",
  "pydantic-settings>=2.7.1",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.38",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4"
]

[tool.setuptools.packages.find]
include = ["app*"]
